name: release-please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@7987109358f1d3ac1a3fd7b6bdd0a2e8f4a116e6 # v4.2.0
        with:
          release-type: simple
          include-component-in-tag: false
